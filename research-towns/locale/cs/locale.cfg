[entity-description]
rt-town-hall=Srdce města, kde se scházejí jeho učenci. Zkoumá jako laboratoř a přijímá jen vědecké balíčky úrovně svého města. Při výzkumu pohlcuje znečištění.
rt-town-ruin=Co zbylo z radnice zničené biteri. Město vytrvalo – dodej materiál přes jeho překladiště a radnice se obnoví ve stejné úrovni.
rt-house=Domov rodin městských výzkumníků. Připojí se k radnici nebo k jinému domu (nejvýš 5 domů v sérii) a zrychluje výzkum. Na nejvyšší úrovni pohlcuje znečištění.
rt-goods-depot=Tady se tvoje dodávky potkávají s potřebami města. Dodává předměty nejbližšímu městu pro jeho další úroveň.
rt-fluid-depot=Tady se tvoje dodávky potkávají s potřebami města. Dodává kapaliny nejbližšímu městu pro jeho další úroveň.
rt-power-depot=Aby v městských dílnách nezhaslo. Zásobuje nejbližší město elektřinou – bez dostatku elektřiny radnice nezkoumá.
rt-town-board=Město tu oznamuje, co potřebuje. Posílá požadavky města do obvodové sítě; režim zvolíš v jejím okně. Signály přepisuje město.

