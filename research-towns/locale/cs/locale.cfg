[tips-and-tricks-item-description]
rt-story=Nauvis nikdy nebyl prázdný. V jeho údolích žijí lidé odnepaměti – znají každou řeku, každé roční období a vědí, jak s planetou žít. Ty znáš stroje.\n\nLaboratoře tu nejsou. Zkoumá se v [entity=rt-town-hall-1] radnicích, kde místní učenci a tvoje inženýrství pracují bok po boku. Dodávej městům suroviny a know-how a vyrostou v centra plná výzkumníků. Jejich pokrok je tvým pokrokem a tvůj jejich.
rt-towns=[entity=rt-town-hall-1] Radnice zkoumá jako laboratoř, ale každá úroveň města přijímá jen některé vědecké balíčky.\n\n[entity=rt-house] Domy stav v dosahu radnice nebo jiného domu – nejvýš 5 domů v sérii. Připojené domy zrychlují výzkum a město je potřebuje k růstu.
rt-depots=Města dostávají zásoby přes překladiště postavená v dosahu městské budovy:\n[entity=rt-goods-depot] předměty, [entity=rt-fluid-depot] kapaliny a [entity=rt-power-depot] elektřinu.\nPřekladiště vždy zásobuje nejbližší město. [entity=rt-town-board] Městská tabule posílá požadavky města do obvodové sítě.
rt-exploring=Města jsou roztroušená po Nauvisu – uvidíš je na mapě a jejich četnost zvolíš při tvorbě mapy ([entity=rt-town-hall-1] Města). První město leží blízko místa přistání a přivítá tě hned.\n\nKdyž dojdeš k dalšímu městu, obyvatelé tě pozdraví a požádají o dar. Dodej ho přes [entity=rt-goods-depot] překladiště u jejich radnice a město se stane tvým partnerem.
rt-milestones=Každá úroveň města otevře jeden nový vědecký balíček. Otevři radnici a uvidíš, co město potřebuje: nový balíček a suroviny. Až je dodávka kompletní a připojeno dost domů, stiskni [font=default-bold]Povýšit město[/font].\n\nSuroviny splněných milníků pak město průběžně spotřebovává – udrž zásobování, jinak radnice stojí. Dodávky navíc postupně vylepšují domy, a ty zrychlují výzkum. Za poslední vědou města rostou dál a získávají produktivitu výzkumu.

