research-towns=Nauvis nikdy nebyl prázdný. Jeho obyvatelé tu žijí odnepaměti a znají planetu lépe než kdokoli jiný – ty znáš stroje. Spojte síly: dodávej jejich městům vědecké balíčky, zboží, kapaliny a elektřinu a výzkum poběží v jejich radnicích místo v laboratořích. Jejich pokrok je tvým pokrokem a tvůj jejich.

