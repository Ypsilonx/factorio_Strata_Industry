[mod-setting-description]
rt-upkeep-multiplier=Kolik surovin města průběžně spotřebovávají (1 = výchozí, 0 = bez spotřeby). Pro pomalé overhauly jako Pyanodon ho sniž.
rt-pollution-absorption=Kolik znečištění pohlcují zkoumající radnice a domy nejvyšší úrovně (1 = výchozí, 0 = vůbec).
rt-specialization-multiplier=Násobí bonus k produktivitě ze specializací měst (1 = výchozí: +1 % za úroveň města, nejvýš +15 % na město a +25 % na materiál; 0 = vypnuto). Jde měnit i v rozehrané hře, bonusy se hned přepočítají.
