rt-fluid-depot=Fluid depot
rt-power-depot=Town substation
rt-hall-beacon=Town research bonus

[entity-description]
rt-town-hall=The heart of the town, where its scholars meet. Researches like a lab and accepts only the science packs of its town level.
rt-house=A home for the families of the town's researchers. Connects to a town hall or another house (at most 5 houses in a row) and speeds up research.
rt-goods-depot=Where your shipments meet the town's needs. Delivers items to the nearest town for its next level.
rt-fluid-depot=Where your shipments meet the town's needs. Delivers fluids to the nearest town for its next level.
rt-power-depot=Keeps the town's workshops lit. Supplies the nearest town with electricity – without enough power the town hall stops researching.

