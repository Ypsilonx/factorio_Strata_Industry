[tips-and-tricks-item-description]
rt-story=Nauvis was never empty. Its people have lived in its valleys for ages – they know every river, every season and how to live alongside the planet. You know machines.\n\nThere are no labs here. Research happens in [entity=rt-town-hall-1] town halls, where local scholars and your engineering work side by side. Bring the towns materials and know-how and they grow into cities full of researchers. Their progress is yours, and yours is theirs.
rt-towns=A [entity=rt-town-hall-1] town hall researches like a lab, but each town level accepts only some science packs.\n\nBuild [entity=rt-house] houses within reach of the town hall or of another house – at most 5 houses in a row. Connected houses speed up research and are needed for the town to grow.
rt-depots=Towns receive supplies through depots placed within reach of a town building:\n[entity=rt-goods-depot] items, [entity=rt-fluid-depot] fluids and [entity=rt-power-depot] electricity.\nA depot always serves the nearest town. Without enough electricity the town hall stops researching.
rt-milestones=Open the town hall to see what the town needs for its next level. When the delivery is complete and enough houses are connected, press [font=default-bold]Upgrade town[/font]. Each level unlocks new science packs and a faster town hall.

