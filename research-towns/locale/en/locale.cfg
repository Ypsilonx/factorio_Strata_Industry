rt-exploring=Finding towns

[tips-and-tricks-item-description]
rt-story=Nauvis was never empty. Its people have lived in its valleys for ages – they know every river, every season and how to live alongside the planet. You know machines.\n\nThere are no labs here. Research happens in [entity=rt-town-hall-1] town halls, where local scholars and your engineering work side by side. Bring the towns materials and know-how and they grow into cities full of researchers. Their progress is yours, and yours is theirs.
rt-towns=A [entity=rt-town-hall-1] town hall researches like a lab, but each town level accepts only some science packs.\n\nBuild [entity=rt-house] houses within reach of the town hall or of another house – at most 5 houses in a row. Connected houses speed up research and are needed for the town to grow.
rt-depots=Towns receive supplies through depots placed within reach of a town building:\n[entity=rt-goods-depot] items, [entity=rt-fluid-depot] fluids and [entity=rt-power-depot] electricity.\nA depot always serves the nearest town. A [entity=rt-town-board] town board sends the town's requests to the circuit network.
rt-exploring=Towns are scattered across Nauvis – you can see them on the map and choose how many there are when creating a map ([entity=rt-town-hall-1] Towns). The first town lies close to your landing site and welcomes you right away.\n\nWhen you reach another town, its people greet you and ask for a gift. Deliver it through a [entity=rt-goods-depot] depot next to their town hall and the town becomes your partner.
rt-milestones=Each town level opens one new science pack. Open the town hall to see what the town needs: the new science pack and materials. When the delivery is complete and enough houses are connected, press [font=default-bold]Upgrade town[/font].\n\nOnce a milestone is done, the town keeps using its materials – keep the supply lines running or the town hall stops. Extra deliveries upgrade houses one by one, which speeds up research. Beyond the last science pack, towns keep growing and gain research productivity.

