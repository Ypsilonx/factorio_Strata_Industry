[mod-name]
research-towns=Research Towns

[mod-description]
research-towns=Nauvis was never empty. Its people have lived here for ages and know the planet better than anyone – you know machines. Partner with them: supply their towns with science packs, goods, fluids and power, and research happens in their town halls instead of labs. Their progress is yours, and yours is theirs.

