rt-goods-depot=Goods depot
rt-fluid-depot=Fluid depot
rt-power-depot=Town substation
rt-hall-beacon=Town research bonus
rt-town-board=Town board
rt-town-site=Town site

[entity-description]
rt-town-hall=The heart of the town, where its scholars meet. Researches like a lab and accepts only the science packs of its town level. While researching it absorbs pollution.
rt-town-ruin=What is left of a town hall destroyed by the biters. The town holds on – deliver materials through its depots and the town hall will be rebuilt at the same level.
rt-house=A home for the families of the town's researchers. Connects to a town hall or another house (at most 5 houses in a row) and speeds up research. At the top level the house absorbs pollution.
rt-goods-depot=Where your shipments meet the town's needs. Delivers items to the nearest town for its next level.
rt-fluid-depot=Where your shipments meet the town's needs. Delivers fluids to the nearest town for its next level.
rt-power-depot=Keeps the town's workshops lit. Supplies the nearest town with electricity – without enough power the town hall stops researching.
rt-town-board=The town announces what it needs. Sends the town's requests to the circuit network; choose the mode in its window. Its signals are rewritten by the town.

